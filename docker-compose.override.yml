# Extra services merged into the Astro CLI's local Airflow stack (astro dev start).
# MongoDB is the target database, Mongo Express is its web admin UI.

services:
  mongodb:
    image: mongo:latest
    container_name: currency_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: currency_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    networks:
      - airflow
      - currency_etl_network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      com.mlops.project: "currency-etl"
      com.mlops.role: "database"
      com.mlops.description: "MongoDB storing transformed EUR exchange rates"
      com.mlops.network: "currency_etl_network"
      com.mlops.storage: "mongo_data:/data/db, mongo_config:/data/configdb"

  mongo-express:
    image: mongo-express:1.0.2
    container_name: currency_mongo_express
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://admin:admin123@mongodb:27017/?authSource=admin
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: admin123
      ME_CONFIG_BASICAUTH: "true"
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123
    ports:
      - "8081:8081"
    networks:
      - currency_etl_network
    labels:
      com.mlops.project: "currency-etl"
      com.mlops.role: "database-admin-ui"
      com.mlops.description: "Mongo Express web UI for MongoDB"
      com.mlops.network: "currency_etl_network"

networks:
  currency_etl_network:
    name: currency_etl_network
    driver: bridge
    labels:
      com.mlops.project: "currency-etl"

volumes:
  mongo_data:
    name: currency_mongo_data
    labels:
      com.mlops.project: "currency-etl"
  mongo_config:
    name: currency_mongo_config
    labels:
      com.mlops.project: "currency-etl"
